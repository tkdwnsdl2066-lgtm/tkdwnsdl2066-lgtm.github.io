name: Update place images

on:
  workflow_dispatch: {}
  schedule:
    # 매일 UTC 01:30 (한국시간 10:30) - 필요하면 바꿔
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate place_images.json
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          node scripts/update-place-images.mjs

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/place_images.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update place images"
            git push
          fi
